<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김도은</title>
  <link rel="stylesheet" href="./자기소개.css">
</head>
<body>

  <!-- 큰 박스는 outer -->
  <div class="outer">
    <h1>자기소개</h1>
    <h3>김도은</h3>
    
    <!-- 작은 항목들은 inner로 통일 -->
    <div class="inner" id="target01">
      <strong><label>이름:</label></strong> <label>김도은</label>
    </div>
    
    <div class="inner" id="target02">
      <strong><label>나이:</label></strong> <label>25</label>
    </div>
    
    <div class="inner" id="target03">
      <strong><label>성별:</label></strong> <input type="button" value="남자">
    </div>
    
    <div class="inner" id="target04">
      <strong><label>Email:</label></strong> <label><mark>aaaaaa@naver.com</mark></label>
    </div>
    
    <!-- 중복된 id를 피해 target05로 수정 -->
    <div class="inner" id="target05">
      <strong><label>취미:</label></strong> 
      <ol type="1">
        <li><label>취침</label></li>
        <li><label>음악</label></li>
        <li><label>게임</label></li>
      </ol>
    </div>
  </div>

</body>
</html>
