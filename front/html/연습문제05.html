<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문하기</title>
</head>
<body>
  <h1>주문관리</h1>
  <h3>주문자 정보 </h3>
  <ol type="1">
    <li><label>주문자명:</label>
    <input type="text"name="nickname"maxlength="20" placeholder="name" required></li>
    <br/>
    <li><label>E-mail:</label>
    <input type="email"name="nickname"maxlength="20" placeholder="1dragon@yaho.com" required ></li>
    <br/>
    <li><label>홈페이지:</label>
    <input type="url"name="nickname"maxlength="20" placeholder="http://" ></li>
    <br/>
  </ol>
 
    <h3>주문정보</h3>
    <ul>
      <li>상품명:<input type="text"></li>
      <li>주문수량:<input type="number"name="nickname"maxlength="20"min="100"  placeholder="최소 100" required></li>
      <li>할인율:<input type="range"min="0"max="100",step="20"value=50></li>
      <br/>
      <li>요청사항:<textarea></textarea></li>
    </ul>
    <br/>
  <input type="submit" value="주문하기">
  
</body>
</html>
